; FPV C5 Lap Timer — XIAO ESP32-S3 timer firmware
;
;   cd fpv_c5
;   pio run -e xiao_esp32s3 -t upload        ; firmware
;   pio run -e xiao_esp32s3 -t uploadfs      ; web UI (data/)
;
; The C5 receiver runs FPVGate C5MK, built from the submodule:
;   cd third_party/FPVGateC5MK/multipilot && pio run -e xiaoc5 -t upload
;
; Needs the submodules: git submodule update --init --recursive

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; Same pioarduino release FPVGate C5MK pins (arduino-esp32 3.x / ESP-IDF 5.5).
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board     = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
; c5host (the C5MK UART link library) comes from the submodule, unmodified.
lib_extra_dirs = ../third_party/FPVGateC5MK/host
lib_deps =
    c5host
    timer_core
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.2
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
